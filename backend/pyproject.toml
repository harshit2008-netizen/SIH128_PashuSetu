[project]
name = "pashusetu-backend"
version = "0.1.0"
description = "PashuSetu API: livestock disease reports, triage, surveillance and advisories"
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
